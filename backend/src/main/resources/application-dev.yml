# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev

  # Redis配置（缓存策略为REDIS时启用）
  data:
    redis:
      host: localhost
      port: 6379
      password: # 如有密码请填写
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/busi_monitor?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql

  # 开发环境允许Swagger访问
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# 日志级别
logging:
  level:
    com.monitor.backend: DEBUG
    org.springframework.web: DEBUG

# API文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
